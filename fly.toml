# Fly.io app config for nyptid-studio backend.
# Migration target from Render (Render service `nyptid-studio-api` is suspended).
#
# Maps the existing Dockerfile + ops/run_render_service.sh entrypoint 1:1 from
# render.yaml. Persistent volume `studio_data` mounted at /var/data replaces
# the Render disk. Redis (queue) is provisioned separately via `fly redis create`
# or Upstash; URL injected as REDIS_URL secret.
#
# Public env vars are mirrored here. Secrets (sync:false in render.yaml) are
# set via `fly secrets set ...` — see ops/fly_migrate_secrets.sh.

app = "nyptid-studio"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = 120  # match render.yaml maxShutdownDelaySeconds

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "10000"
  WEB_CONCURRENCY = "4"
  FRONTEND_DIST_DIR = "/app/ViralShorts-App/dist"
  APP_DATA_DIR = "/var/data"
  STUDIO_AGENT_SESSIONS_DIR = "/var/data/studio_agent_sessions"
  STUDIO_AGENT_TELEMETRY_DIR = "/var/data/studio_agent_telemetry"
  STUDIO_TRAINING_CAPTURE_DIR = "/var/data/training_capture"
  STUDIO_TRAINING_CONSENT_VERSION = "2026-06-v1"
  STUDIO_TRAINING_COMPILER_INTERVAL_SEC = "21600"
  STUDIO_TRAINING_SUPABASE_SYNC_ENABLED = "false"
  STUDIO_AGENT_COMPETITOR_DIR = "/var/data/competitor_analysis"
  STUDIO_AGENT_ARCHIVAL_DIR = "/var/data/archival_manifests"
  OUTPUT_DIR = "/var/data/generated_videos"
  TEMP_DIR = "/var/data/temp_assets"
  TRAINING_DATA_DIR = "/var/data/training_data"
  THUMBNAIL_DIR = "/var/data/thumbnails"
  DEMO_UPLOAD_DIR = "/var/data/demo_uploads"
  SKELETON_AI_OUTPUT_ROOT = "/var/data/skeleton_output"
  # Redis-backed queue is required before scaling beyond one app process.
  # REDIS_URL is stored as a Fly secret; Redis is pay-as-you-go Upstash.
  REDIS_QUEUE_ENABLED = "true"
  REDIS_QUEUE_PREFIX = "studio"
  # Studio Agent OpenRouter + fal concurrency gate. With Redis enabled this is
  # shared across app processes; 500 active users should queue/poll, not launch
  # 500 simultaneous render/tool calls.
  STUDIO_AGENT_QUEUE_ENABLED = "true"
  STUDIO_AGENT_MAX_CONCURRENT = "30"
  STUDIO_AGENT_MAX_QUEUE_DEPTH = "500"
  STUDIO_AGENT_QUEUE_MAX_WAIT_SEC = "900"
  STUDIO_PRODUCTION_RENDER_SLOTS = "6"
  STUDIO_PRODUCTION_STILLS_SLOTS = "12"
  STUDIO_PRODUCTION_I2V_SLOTS = "4"
  STUDIO_PRODUCTION_I2V_PREMIUM_SLOTS = "1"
  STUDIO_PRODUCTION_AUDIO_SLOTS = "8"
  STUDIO_PRODUCTION_COMPOSE_SLOTS = "4"
  STUDIO_PRODUCTION_SLOT_MAX_WAIT_SEC = "1800"
  SHORTFORM_JOB_STALE_SEC = "3600"
  STUDIO_FINALIZE_QA_REQUIRED = "false"
  STUDIO_LONGFORM_MAX_SCENES = "144"
  STUDIO_MODELS_CACHE_SEC = "900"
  JOB_QUEUE_WORKERS = "1"
  RUN_EMBEDDED_WORKER = "true"
  SITE_URL = "https://studio.nyptidindustries.com"
  PAYPAL_ENV = "live"
  IMAGE_PROVIDER_ORDER = "fal"
  XAI_IMAGE_FALLBACK_ENABLED = "true"
  HIDREAM_ENABLED = "false"
  HIDREAM_EDIT_ENABLED = "false"
  SKELETON_REQUIRE_WAN22 = "false"
  SKELETON_USE_SEEDREAM_EDIT = "true"
  SKELETON_GLOBAL_REFERENCE_IMAGE_URL = "https://studio.nyptidindustries.com/canonical-skeleton-master-hires.png"
  RUNPOD_IMAGE_FEEDBACK_ENABLED = "false"
  RUNPOD_COMPOSITOR_ENABLED = "false"
  CHATSTORY_FORCE_LOCAL_TTS = "false"
  CHATSTORY_ELEVENLABS_MODEL_ID = "eleven_multilingual_v2"
  WAITLIST_ONLY_MODE = "false"
  WAITLIST_REQUIRE_STRIPE_PAYMENT = "false"
  ALGROW_API_BASE_URL = "https://api.algrow.online"
  # Catalyst 24/7 self-learning: continuously scrape trending per niche and update
  # the "what works" corpus. Quota-safe (budget-capped per tick, ~4 ticks/day).
  CATALYST_BACKFILL_AUTO_ENABLED = "true"
  CATALYST_BACKFILL_AUTO_INTERVAL_SEC = "21600"
  # Studio Agent Catalyst runtime: warm public niche cache + refresh stale OAuth channels.
  # 600s = 10 minutes continuous niche warm + channel sync (quota-safe with prefer_recent).
  STUDIO_CATALYST_AUTO_ENABLED = "true"
  STUDIO_CATALYST_TICK_INTERVAL_SEC = "600"
  STUDIO_CATALYST_NICHE_WARM_MAX = "6"
  STUDIO_CATALYST_CHANNEL_SYNC_MAX = "8"
  # Reference video analysis: Anthropic Haiku vision/story, xAI STT, FAL whisper fallback.
  STUDIO_REFERENCE_VISION_PROVIDER_ORDER = "anthropic,fal,openrouter"
  STUDIO_REFERENCE_ANALYSIS_PROVIDER_ORDER = "anthropic,fal,openrouter"
  STUDIO_REFERENCE_STT_PROVIDER_ORDER = "xai,fal"
  STUDIO_REFERENCE_VISION_MODEL = "claude-haiku-4-5-20251001"
  STUDIO_REFERENCE_ANALYSIS_MODEL = "claude-haiku-4-5-20251001"
  STUDIO_AGENT_VISION_MODEL_FAL = "anthropic/claude-haiku-4.5"
  STUDIO_AGENT_ANALYSIS_MODEL_FAL = "anthropic/claude-haiku-4.5"
  STUDIO_SHORTS_ONLY = "false"
  # RunPod is intentionally inactive until the endpoint is funded and its
  # strict worker image passes a live canary. Fly continues using the existing
  # provider-backed production path while these gates are off.
  STUDIO_RUNPOD_PRODUCTION_ENABLED = "false"
  STUDIO_RUNPOD_LONGFORM_ENABLED = "false"
  RUNPOD_DISPATCH_MAX_QUEUE_DEPTH = "1"

[[mounts]]
  source = "studio_data"
  destination = "/var/data"
  initial_size = "15gb"

[http_service]
  internal_port = 10000
  force_https = true
  # Don't auto-stop — embedded worker needs to keep running for queued jobs,
  # and a cold-start hit on the first user request would be ugly.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 500
    hard_limit = 650

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "60s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-4x"
  memory = "4gb"
  # Single-machine launch profile because Studio media/jobs live on one attached
  # volume. Scale horizontally only after moving job artifacts to shared object
  # storage or adding sticky routing for job media.
