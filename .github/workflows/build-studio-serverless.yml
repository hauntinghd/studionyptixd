name: Build Studio Serverless Image

on:
  workflow_dispatch:       # manual trigger from GitHub Actions tab
  push:
    branches: [master]
    paths:
      - '*.py'
      - 'requirements.txt'
      - 'runpod-serverless/**'
      - 'ViralShorts-App/src/**'
      - 'ViralShorts-App/package*.json'
      - '.github/workflows/build-studio-serverless.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: crypticsciencee/studio-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: CrypticSciencee
          password: ${{ secrets.CRYPTIC_GHCR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: runpod-serverless/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make GHCR package public (RunPod needs unauthenticated pulls)
        run: |
          set -euo pipefail
          # Attempt the PATCH + capture HTTP status. Fails the workflow loudly
          # if the package ends up private — RunPod would fail cold-boot pulls
          # with a "manifest unknown" error that takes forever to diagnose.
          RESP_BODY=$(mktemp)
          HTTP_STATUS=$(curl -sS -o "$RESP_BODY" -w "%{http_code}" -X PATCH \
            -H "Authorization: Bearer ${{ secrets.CRYPTIC_GHCR_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/users/CrypticSciencee/packages/container/studio-backend" \
            -d '{"visibility":"public"}')
          echo "PATCH status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "204" ]; then
            echo "::error::Could not set GHCR package visibility to public (status $HTTP_STATUS)."
            echo "Response body:"
            cat "$RESP_BODY" || true
            echo ""
            echo "Most likely causes: CRYPTIC_GHCR_PAT expired or missing 'write:packages' scope."
            exit 1
          fi
          # Verify: GET the package and confirm visibility is actually 'public' now.
          VIS=$(curl -sS \
            -H "Authorization: Bearer ${{ secrets.CRYPTIC_GHCR_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/users/CrypticSciencee/packages/container/studio-backend" \
            | python3 -c "import sys, json; print(json.load(sys.stdin).get('visibility', 'unknown'))")
          echo "Verified visibility: $VIS"
          if [ "$VIS" != "public" ]; then
            echo "::error::PATCH returned $HTTP_STATUS but visibility is still '$VIS'. RunPod will fail to pull."
            exit 1
          fi
          echo "GHCR package is public; RunPod can pull anonymously."
