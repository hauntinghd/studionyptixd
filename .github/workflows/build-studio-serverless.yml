name: Build Studio Serverless Image

on:
  workflow_dispatch:       # manual trigger from GitHub Actions tab
  push:
    branches: [master]
    paths:
      - '*.py'
      - 'requirements.txt'
      - 'runpod-serverless/**'
      - 'ViralShorts-App/src/**'
      - 'ViralShorts-App/package*.json'
      - '.github/workflows/build-studio-serverless.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: crypticsciencee/studio-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: CrypticSciencee
          password: ${{ secrets.CRYPTIC_GHCR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: runpod-serverless/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make GHCR package public (best-effort, package was made public manually)
        # The CRYPTIC_GHCR_PAT can push to the package but lacks the user-level
        # `write:packages` scope needed to manage visibility metadata, so this PATCH
        # has historically returned 404. Casey set the package to public manually
        # once and it stays that way, so this step is best-effort. RunPod has been
        # pulling fine for 5000+ jobs. If RunPod ever starts failing cold-boot
        # pulls with "manifest unknown", verify the package is still public at
        # https://github.com/users/CrypticSciencee/packages/container/studio-backend
        continue-on-error: true
        run: |
          curl -sf -X PATCH \
            -H "Authorization: Bearer ${{ secrets.CRYPTIC_GHCR_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/users/CrypticSciencee/packages/container/studio-backend" \
            -d '{"visibility":"public"}' \
          && echo "Package visibility PATCH succeeded" \
          || echo "::warning::Package visibility PATCH failed (expected — PAT lacks scope). Verify package is public manually if RunPod pulls fail."
