name: Publish API Image

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - codex/render-studio-backend
    paths:
      - Dockerfile
      - requirements.txt
      - "**/*.py"      # recursive so zerotier_private/, skeleton_ai/, long_form/ subpackage edits trigger the rebuild
      - client_secrets.json
      - ops/run_render_service.sh
      - ViralShorts-App/**
      - .github/workflows/publish-api-image.yml

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_IMAGE: docker.io/nyptid/nyptid-studio-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:latest
            ${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}

      # Auto-deploy the freshly-built image to Fly.io so backend changes
      # actually go live without a manual `flyctl deploy`. Requires the
      # FLY_API_TOKEN repo secret (generate via `flyctl tokens create deploy`).
      #
      # PRIOR BUG (fixed in this commit): the previous guard
      #   if: ${{ github.ref == 'refs/heads/master' && env.FLY_API_TOKEN != '' }}
      # silently skipped both Setup flyctl AND Deploy to Fly.io because
      # secret-derived job-level env vars don't reliably populate the
      # `env` context inside `if:` expressions. This caused PR #117 / #118 /
      # #119 / #120 / #121 to all push fresh images to Docker Hub but never
      # update Fly — Fly stayed pinned to whatever Casey last `flyctl deploy`'d
      # manually. Replaced with a step-output check so the condition
      # evaluates against an explicit shell-tested value, and moved the
      # FLY_API_TOKEN env into the deploy step (so flyctl picks it up) rather
      # than the job (where it just polluted the if-context).
      - name: Check Fly token availability
        id: fly_token_check
        run: |
          if [ -z "${{ secrets.FLY_API_TOKEN }}" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FLY_API_TOKEN secret is unset — Fly deploy will be skipped."
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup flyctl
        if: ${{ github.ref == 'refs/heads/master' && steps.fly_token_check.outputs.has_token == 'true' }}
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        if: ${{ github.ref == 'refs/heads/master' && steps.fly_token_check.outputs.has_token == 'true' }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy \
            --image ${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }} \
            -a nyptid-studio \
            --strategy rolling
