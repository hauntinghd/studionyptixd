name: Publish API Image

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - codex/render-studio-backend
      - "release/**"
    paths:
      - Dockerfile
      - .dockerignore
      - requirements.txt
      - "**/*.py"
      - client_secrets.json
      - ops/**
      - cliplab/**
      - long_form/**
      - media_sources/**
      - skeleton_ai/**
      - studio/**
      - studio_agent/**
      - zerotier_private/**
      - ViralShorts-App/**
      - .github/workflows/**

permissions:
  contents: read

# Serialize releases from the same branch so two master pushes cannot race and
# leave production (or the verified `latest` tag) on the older commit.
concurrency:
  group: publish-api-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-candidate:
    name: Verify exact release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Set up production Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile all production Python with the image runtime
        run: |
          python -m compileall -q \
            *.py \
            cliplab \
            long_form \
            media_sources \
            skeleton_ai \
            studio \
            studio_agent \
            zerotier_private

      - name: Run release-critical backend suites
        run: |
          python -m pytest -q \
            tests/test_studio_paid_access.py \
            tests/test_seedream_model_catalog.py \
            tests/test_video_model_catalog.py \
            tests/test_video_pricing.py \
            tests/test_billing_webhook_idempotency.py \
            test_unified_credits.py \
            tests/test_unified_credits_settlement.py \
            tests/test_runtime_security.py \
            tests/test_security_boundaries.py \
            tests/test_public_api_authorization.py \
            tests/test_private_media_auth.py \
            tests/test_media_file_ownership.py \
            tests/test_studio_agent_job_ownership.py \
            tests/test_long_form_router_job_ownership.py \
            tests/test_static_security_remediation.py \
            tests/test_clone_billing.py \
            tests/test_longform_media_revision.py \
            tests/test_shortform_background_route.py \
            tests/test_skeleton_cast_integrity.py \
            tests/test_studio_media_routing.py \
            tests/test_studio_repair_safety.py \
            tests/test_studio_session_store.py \
            tests/test_studio_command_layer.py \
            tests/test_studio_command_runner.py \
            tests/test_production_command_authority.py \
            tests/test_production_command_v2.py \
            tests/test_production_workflows.py \
            tests/test_contabo_release_contract.py \
            tests/test_fly_cutover_evidence.py \
            tests/test_embedded_generation_queue.py \
            tests/test_frontend_static.py \
            tests/test_xai_runtime_hard_disable.py \
            tests/test_desktop_release_channel.py \
            tests/test_skeleton_command_boundary.py \
            tests/test_cliplab_command_boundary.py \
            tests/test_runpod_direct_routes.py \
            tests/test_runpod_standalone_routes.py

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ViralShorts-App/package-lock.json

      - name: Install frontend dependencies
        working-directory: ViralShorts-App
        run: npm ci

      - name: Build production frontend
        working-directory: ViralShorts-App
        run: npm run build

      - name: Verify Cloudflare-to-Contabo streaming ingress contract
        working-directory: runpod-serverless
        run: node --test worker-proxy.test.mjs

      - name: Install Tauri Linux test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf

      - name: Set up stable Rust with formatting support
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache locked Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ViralShorts-App/src-tauri/target
          key: ${{ runner.os }}-studio-tauri-${{ hashFiles('ViralShorts-App/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-studio-tauri-

      - name: Verify desktop updater trust anchor and Rust release contract
        working-directory: ViralShorts-App/src-tauri
        run: |
          cargo fmt --all --check
          cargo test --locked --test updater_release

  build-and-publish:
    name: Publish exact-SHA distribution image
    needs: verify-candidate
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      build_id: ${{ steps.release_identity.outputs.build_id }}
      image_ref: ${{ steps.immutable_image.outputs.image_ref }}
    env:
      DOCKERHUB_IMAGE: docker.io/nyptid/nyptid-studio-api
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Define deterministic release identity
        id: release_identity
        run: |
          set -euo pipefail
          commit_epoch="$(git show -s --format=%ct "${GITHUB_SHA}")"
          release_timestamp="$(date -u -d "@${commit_epoch}" +%Y%m%dT%H%M%SZ)"
          build_id="studio-${release_timestamp}-${GITHUB_SHA:0:12}"
          echo "build_id=${build_id}" >>"${GITHUB_OUTPUT}"
          printf 'Release identity: %s / %s\n' "${GITHUB_SHA}" "${build_id}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push immutable API image
        id: build_push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            FRONTEND_BUILD_ID=${{ steps.release_identity.outputs.build_id }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release_identity.outputs.build_id }}
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}

      - name: Bind release to the exact published manifest digest
        id: immutable_image
        env:
          IMAGE_DIGEST: ${{ steps.build_push.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::Docker publish did not return an immutable manifest digest"
            exit 1
          }
          image_ref="${DOCKERHUB_IMAGE}@${IMAGE_DIGEST}"
          echo "image_ref=${image_ref}" >>"${GITHUB_OUTPUT}"
          printf 'Immutable image: %s\n' "${image_ref}"

  deploy-production:
    name: Deploy exact candidate to Contabo
    needs: build-and-publish
    if: ${{ github.ref == 'refs/heads/master' }}
    uses: ./.github/workflows/deploy-studio.yml
    with:
      git_sha: ${{ github.sha }}
      build_id: ${{ needs.build-and-publish.outputs.build_id }}
      image_ref: ${{ needs.build-and-publish.outputs.image_ref }}
    secrets:
      CONTABO_SSH_HOST: ${{ secrets.CONTABO_SSH_HOST }}
      CONTABO_SSH_USER: ${{ secrets.CONTABO_SSH_USER }}
      CONTABO_SSH_PORT: ${{ secrets.CONTABO_SSH_PORT }}
      CONTABO_SSH_KEY: ${{ secrets.CONTABO_SSH_KEY }}
      CONTABO_SSH_KNOWN_HOSTS: ${{ secrets.CONTABO_SSH_KNOWN_HOSTS }}
