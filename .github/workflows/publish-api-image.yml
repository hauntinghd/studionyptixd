name: Publish API Image

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - codex/render-studio-backend
      - "release/**"
    paths:
      - Dockerfile
      - .dockerignore
      - requirements.txt
      - "**/*.py"
      - client_secrets.json
      - ops/**
      - cliplab/**
      - long_form/**
      - media_sources/**
      - skeleton_ai/**
      - studio/**
      - studio_agent/**
      - zerotier_private/**
      - ViralShorts-App/**
      - .github/workflows/**

permissions:
  contents: read

# Serialize releases from the same branch so two master pushes cannot race and
# leave production (or the verified `latest` tag) on the older commit.
concurrency:
  group: publish-api-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-candidate:
    name: Verify exact release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Set up production Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile all production Python with the image runtime
        run: |
          python -m compileall -q \
            *.py \
            cliplab \
            long_form \
            media_sources \
            skeleton_ai \
            studio \
            studio_agent \
            zerotier_private

      - name: Run release-critical backend suites
        run: |
          mapfile -t release_tests < <(
            grep -Ev '^[[:space:]]*(#|$)' ops/release_backend_tests.txt
          )
          test "${#release_tests[@]}" -gt 0
          for test_path in "${release_tests[@]}"; do
            test -e "${test_path}"
          done
          python -m pytest -q "${release_tests[@]}"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ViralShorts-App/package-lock.json

      - name: Install frontend dependencies
        working-directory: ViralShorts-App
        run: npm ci

      - name: Build production frontend
        working-directory: ViralShorts-App
        run: npm run build

      - name: Verify Cloudflare-to-Contabo streaming ingress contract
        working-directory: runpod-serverless
        run: node --test worker-proxy.test.mjs

      - name: Install Tauri Linux test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf

      - name: Set up stable Rust with formatting support
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache locked Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ViralShorts-App/src-tauri/target
          key: ${{ runner.os }}-studio-tauri-${{ hashFiles('ViralShorts-App/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-studio-tauri-

      - name: Verify desktop updater trust anchor and Rust release contract
        working-directory: ViralShorts-App/src-tauri
        run: |
          cargo fmt --all --check
          cargo test --locked --test updater_release

  build-and-publish:
    name: Publish exact-SHA distribution image
    needs: verify-candidate
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      build_id: ${{ steps.release_identity.outputs.build_id }}
      image_ref: ${{ steps.immutable_image.outputs.image_ref }}
    env:
      DOCKERHUB_IMAGE: docker.io/nyptid/nyptid-studio-api
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Define deterministic release identity
        id: release_identity
        run: |
          set -euo pipefail
          commit_epoch="$(git show -s --format=%ct "${GITHUB_SHA}")"
          release_timestamp="$(date -u -d "@${commit_epoch}" +%Y%m%dT%H%M%SZ)"
          build_id="studio-${release_timestamp}-${GITHUB_SHA:0:12}"
          echo "build_id=${build_id}" >>"${GITHUB_OUTPUT}"
          printf 'Release identity: %s / %s\n' "${GITHUB_SHA}" "${build_id}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push immutable API image
        id: build_push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            FRONTEND_BUILD_ID=${{ steps.release_identity.outputs.build_id }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release_identity.outputs.build_id }}
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}

      - name: Bind release to the exact published manifest digest
        id: immutable_image
        env:
          IMAGE_DIGEST: ${{ steps.build_push.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::Docker publish did not return an immutable manifest digest"
            exit 1
          }
          image_ref="${DOCKERHUB_IMAGE}@${IMAGE_DIGEST}"
          echo "image_ref=${image_ref}" >>"${GITHUB_OUTPUT}"
          printf 'Immutable image: %s\n' "${image_ref}"

  contabo-deploy-readiness:
    name: Check Contabo deploy opt-in
    needs: build-and-publish
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - name: Gate automatic deployment on a non-root release principal
        id: gate
        env:
          CONTABO_AUTO_DEPLOY_ENABLED: ${{ vars.CONTABO_AUTO_DEPLOY_ENABLED }}
          CONTABO_SSH_HOST: ${{ secrets.CONTABO_SSH_HOST }}
          CONTABO_SSH_USER: ${{ secrets.CONTABO_SSH_USER }}
          CONTABO_SSH_PORT: ${{ secrets.CONTABO_SSH_PORT }}
          CONTABO_SSH_KEY: ${{ secrets.CONTABO_SSH_KEY }}
          CONTABO_SSH_KNOWN_HOSTS: ${{ secrets.CONTABO_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          ready=false
          if [ "${CONTABO_AUTO_DEPLOY_ENABLED,,}" != "true" ]; then
            echo "::notice::Contabo auto-deploy is disabled; verification and immutable image publication remain complete."
          else
            missing=()
            for name in \
              CONTABO_SSH_HOST \
              CONTABO_SSH_USER \
              CONTABO_SSH_PORT \
              CONTABO_SSH_KEY \
              CONTABO_SSH_KNOWN_HOSTS; do
              if [ -z "${!name:-}" ]; then
                missing+=("${name}")
              fi
            done
            if [ "${#missing[@]}" -gt 0 ]; then
              printf '::notice::Contabo auto-deploy skipped; missing least-privilege secret(s): %s\n' "${missing[*]}"
            elif [ "${CONTABO_SSH_USER}" = "root" ]; then
              echo "::notice::Contabo auto-deploy skipped; CONTABO_SSH_USER must be a dedicated non-root release principal."
            else
              ready=true
            fi
          fi
          printf 'ready=%s\n' "${ready}" >>"${GITHUB_OUTPUT}"

  deploy-production:
    name: Deploy exact candidate to Contabo
    needs:
      - build-and-publish
      - contabo-deploy-readiness
    if: ${{ github.ref == 'refs/heads/master' && needs.contabo-deploy-readiness.outputs.ready == 'true' }}
    uses: ./.github/workflows/deploy-studio.yml
    with:
      git_sha: ${{ github.sha }}
      build_id: ${{ needs.build-and-publish.outputs.build_id }}
      image_ref: ${{ needs.build-and-publish.outputs.image_ref }}
    secrets:
      CONTABO_SSH_HOST: ${{ secrets.CONTABO_SSH_HOST }}
      CONTABO_SSH_USER: ${{ secrets.CONTABO_SSH_USER }}
      CONTABO_SSH_PORT: ${{ secrets.CONTABO_SSH_PORT }}
      CONTABO_SSH_KEY: ${{ secrets.CONTABO_SSH_KEY }}
      CONTABO_SSH_KNOWN_HOSTS: ${{ secrets.CONTABO_SSH_KNOWN_HOSTS }}
