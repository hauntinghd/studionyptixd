name: Publish API Image

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - codex/render-studio-backend
    paths:
      - Dockerfile
      - requirements.txt
      - "*.py"
      - client_secrets.json
      - ops/run_render_service.sh
      - ViralShorts-App/**
      - .github/workflows/publish-api-image.yml

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_IMAGE: docker.io/nyptid/nyptid-studio-api
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:latest
            ${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}

      # Auto-deploy the freshly-built image to Fly.io so backend changes
      # actually go live without a manual `flyctl deploy`. Requires the
      # FLY_API_TOKEN repo secret (generate via `flyctl tokens create deploy`).
      # Skips on non-master branches and when the secret is missing.
      - name: Setup flyctl
        if: ${{ github.ref == 'refs/heads/master' && env.FLY_API_TOKEN != '' }}
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        if: ${{ github.ref == 'refs/heads/master' && env.FLY_API_TOKEN != '' }}
        run: |
          flyctl deploy \
            --image ${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }} \
            -a nyptid-studio \
            --strategy rolling
