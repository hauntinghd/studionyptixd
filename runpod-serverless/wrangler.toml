# Keep the existing Worker name so deployment updates the custom-domain
# ingress in place instead of creating a second competing Worker.
name = "studio-runpod-proxy"
main = "worker-proxy.js"
compatibility_date = "2026-04-01"
workers_dev = false

# Canonical Studio API custom domain. Cloudflare terminates public TLS and the
# Worker streams every request to the single backend-owned Contabo service.
routes = [
  { pattern = "api-studio.nyptidindustries.com", custom_domain = true }
]

# Required origin-auth credential (never put the value in this file):
#   npx wrangler secret put STUDIO_ORIGIN_TOKEN --config wrangler.toml
# The Worker fails closed before fetch() when this secret is absent or invalid.

[vars]
# Nonsecret origin override for the Contabo Caddy ingress.
CONTABO_STUDIO_ORIGIN = "https://studio.82.197.67.155.sslip.io"

[observability]
enabled = true
